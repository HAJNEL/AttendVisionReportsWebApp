<nav class="bottom-nav">
  @for (item of visibleTabs; track item.route) {
    <a
      class="nav-tab"
      [routerLink]="item.route"
      routerLinkActive="active"
      [attr.aria-label]="item.label"
    >
      <mat-icon>{{ item.icon }}</mat-icon>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  }
  <button
    class="nav-tab more-tab"
    [class.active]="isMoreActive"
    [matMenuTriggerFor]="moreMenu"
    aria-label="More menu items"
  >
    <mat-icon>more_horiz</mat-icon>
    <span class="nav-label">More</span>
  </button>
</nav>

<mat-menu #moreMenu="matMenu" yPosition="above" class="bottom-nav-more-menu">
  @for (item of visibleMoreItems; track item.route) {
    <a mat-menu-item [routerLink]="item.route" routerLinkActive="active-more-link">
      <mat-icon>{{ item.icon }}</mat-icon>
      <span>{{ item.label }}</span>
    </a>
  }
  @if (visibleMoreItems.length > 0) {
    <mat-divider></mat-divider>
  }
  <button mat-menu-item (click)="onLogout()">
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </button>
</mat-menu>
